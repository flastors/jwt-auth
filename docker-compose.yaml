services:
  auth-app:
    build: .
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - service_network
    environment:
      DB_HOST: postgres

  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    expose:
      - 5432
    networks:
      - service_network
    volumes:
      - /var/lib/postgresql/data

networks:
  service_network:
    driver: bridge
